<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AppVault — My Apps</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #07070d;
      --surface: #0e0e18;
      --surface2: #14141f;
      --surface3: #1a1a28;
      --border: rgba(255,255,255,0.06);
      --border2: rgba(255,255,255,0.12);
      --accent: #00e5ff;
      --accent2: #b388ff;
      --accent3: #69ff47;
      --warn: #ffd740;
      --danger: #ff6b6b;
      --text: #eeeef5;
      --text2: #a0a0b8;
      --muted: #52526a;
      --r: 16px;
      --r-sm: 10px;
    }

    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .bg-fx {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(ellipse 70% 50% at 15% 0%, rgba(0,229,255,0.06) 0%, transparent 65%),
        radial-gradient(ellipse 50% 40% at 85% 100%, rgba(179,136,255,0.07) 0%, transparent 60%),
        radial-gradient(ellipse 40% 30% at 50% 50%, rgba(105,255,71,0.03) 0%, transparent 70%);
    }

    /* ─── Device Banner ─── */
    #device-banner {
      position: relative; z-index: 10;
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px clamp(1.5rem, 5vw, 4rem);
      background: rgba(0,229,255,0.06);
      border-bottom: 1px solid rgba(0,229,255,0.15);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--accent);
      gap: 1rem;
      flex-wrap: wrap;
    }
    .device-info { display: flex; align-items: center; gap: 8px; }
    .device-icon { font-size: 1rem; }
    .device-label { color: var(--text2); }
    .device-label strong { color: var(--accent); }
    .compat-note {
      background: rgba(0,229,255,0.1);
      border: 1px solid rgba(0,229,255,0.2);
      border-radius: 6px;
      padding: 3px 10px;
      font-size: 0.68rem;
    }
    /* ABI badge shown in banner when detected */
    #abi-banner-badge {
      display: none;
      align-items: center; gap: 6px;
      background: rgba(105,255,71,0.08);
      border: 1px solid rgba(105,255,71,0.22);
      border-radius: 6px;
      padding: 3px 10px;
      font-size: 0.68rem;
      color: var(--accent3);
    }
    #abi-banner-badge.show { display: flex; }

    /* ─── Header ─── */
    header {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 clamp(1.5rem, 5vw, 4rem);
      height: 60px;
      background: rgba(7,7,13,0.9);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .logo {
      display: flex; align-items: center; gap: 10px;
      font-size: 1.05rem; font-weight: 700; letter-spacing: -0.02em;
    }
    .logo-mark {
      width: 30px; height: 30px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 8px;
      display: grid; place-items: center;
      font-size: 14px;
    }
    .logo span { color: var(--accent); }
    .header-right { display: flex; align-items: center; gap: 0.75rem; }

    .search-wrap { position: relative; }
    .search-wrap svg {
      position: absolute; left: 11px; top: 50%;
      transform: translateY(-50%); color: var(--muted); pointer-events: none;
    }
    #search {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      padding: 8px 14px 8px 34px;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      width: 200px; outline: none;
      transition: border-color 0.2s, width 0.3s;
    }
    #search:focus { border-color: var(--accent); width: 260px; }
    #search::placeholder { color: var(--muted); }

    body.tv-mode header { height: 72px; }
    body.tv-mode #search { font-size: 1rem; padding: 10px 16px 10px 40px; }
    body.tv-mode .logo { font-size: 1.3rem; }

    /* ─── Hero ─── */
    .hero {
      position: relative; z-index: 1;
      padding: clamp(2.5rem, 6vw, 5rem) clamp(1.5rem, 5vw, 4rem) clamp(1.5rem, 4vw, 2.5rem);
    }
    .hero-eyebrow {
      display: inline-flex; align-items: center; gap: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem; letter-spacing: 0.08em;
      color: var(--accent);
      background: rgba(0,229,255,0.07);
      border: 1px solid rgba(0,229,255,0.18);
      border-radius: 99px; padding: 4px 12px;
      margin-bottom: 1.25rem;
    }
    .live-dot {
      width: 6px; height: 6px;
      background: var(--accent3);
      border-radius: 50%;
      animation: pulse-dot 2s infinite;
    }
    @keyframes pulse-dot {
      0%,100%{opacity:1;transform:scale(1)}
      50%{opacity:0.4;transform:scale(0.7)}
    }
    h1 {
      font-size: clamp(2rem, 5.5vw, 3.8rem);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.03em;
      margin-bottom: 0.9rem;
    }
    h1 .grad {
      background: linear-gradient(100deg, var(--accent) 0%, var(--accent2) 60%, var(--accent3) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .hero-sub {
      color: var(--text2); font-size: 0.95rem; line-height: 1.7;
      max-width: 500px;
    }

    /* ─── Stats strip ─── */
    .stats-strip {
      position: relative; z-index: 1;
      display: flex; gap: 1.5rem;
      padding: 0 clamp(1.5rem, 5vw, 4rem) 2rem;
      flex-wrap: wrap;
    }
    .stat-pill {
      display: flex; align-items: center; gap: 8px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 6px 14px;
      font-size: 0.78rem; font-weight: 600;
    }
    .stat-pill .n { color: var(--accent); font-family: 'JetBrains Mono', monospace; }
    .stat-pill .l { color: var(--text2); font-size: 0.7rem; font-weight: 400; }

    /* ─── Section Layout ─── */
    .content-area {
      position: relative; z-index: 1;
      padding: 0 clamp(1.5rem, 5vw, 4rem) 5rem;
      display: flex; flex-direction: column; gap: 3rem;
    }

    .section-heading {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 1.25rem;
    }
    .section-heading-icon {
      width: 28px; height: 28px;
      border-radius: 7px;
      display: grid; place-items: center;
      font-size: 14px;
    }
    .section-heading h2 {
      font-size: 1rem; font-weight: 700;
      letter-spacing: -0.01em;
    }
    .section-heading .badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      color: var(--muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 2px 9px;
      margin-left: auto;
    }

    /* ─── Filter Bar ─── */
    .filter-row {
      position: relative; z-index: 1;
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0 clamp(1.5rem, 5vw, 4rem) 1.5rem;
      flex-wrap: wrap;
    }
    .filter-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem; color: var(--muted);
      letter-spacing: 0.07em; margin-right: 0.25rem;
    }
    .filter-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text2);
      border-radius: 99px;
      padding: 5px 13px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
    .filter-btn.active {
      background: rgba(0,229,255,0.1);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ─── App Grid ─── */
    .app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 1.1rem;
    }
    .app-grid.featured {
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    }

    /* ─── App Card ─── */
    .app-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 1.35rem;
      display: flex; flex-direction: column; gap: 0;
      position: relative; overflow: hidden;
      transition: transform 0.2s cubic-bezier(.22,1,.36,1), border-color 0.2s, box-shadow 0.2s;
      animation: fadeUp 0.35s both;
    }
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(18px) }
      to   { opacity:1; transform:translateY(0) }
    }
    .app-card:hover {
      transform: translateY(-5px);
      border-color: rgba(0,229,255,0.22);
      box-shadow: 0 20px 50px rgba(0,0,0,0.55), 0 0 0 1px rgba(0,229,255,0.07);
    }
    .app-card.top-pick {
      border-color: rgba(0,229,255,0.2);
      background: linear-gradient(145deg, rgba(0,229,255,0.04), var(--surface) 40%);
    }
    .app-card.top-pick::after {
      content: '★ TOP PICK';
      position: absolute; top: 12px; right: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.58rem; letter-spacing: 0.08em;
      color: var(--warn); background: rgba(255,215,64,0.1);
      border: 1px solid rgba(255,215,64,0.25);
      border-radius: 4px; padding: 2px 7px;
    }
    .app-card.device-match {
      border-color: rgba(105,255,71,0.2);
    }
    .app-card.device-match::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 70% 40% at 50% -5%, rgba(105,255,71,0.04), transparent);
      pointer-events: none;
    }

    .card-top {
      display: flex; align-items: flex-start; gap: 0.9rem;
      margin-bottom: 0.85rem;
    }
    .app-icon {
      width: 50px; height: 50px;
      border-radius: 12px;
      object-fit: cover;
      flex-shrink: 0;
      border: 1px solid var(--border);
    }
    .app-icon-placeholder {
      width: 50px; height: 50px;
      border-radius: 12px;
      display: grid; place-items: center;
      font-size: 22px;
      flex-shrink: 0;
      border: 1px solid var(--border);
    }
    .app-meta { flex: 1; min-width: 0; }
    .app-name {
      font-size: 0.97rem; font-weight: 700;
      letter-spacing: -0.01em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .app-version {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.67rem; color: var(--muted); margin-top: 3px;
    }
    .platform-pills {
      display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px;
    }
    .plat {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.6rem; padding: 2px 6px;
      border-radius: 4px; letter-spacing: 0.03em;
    }
    .plat-android { background:rgba(105,255,71,0.1); color:#69ff47; border:1px solid rgba(105,255,71,0.2); }
    .plat-android-tv { background:rgba(0,229,255,0.1); color:#00e5ff; border:1px solid rgba(0,229,255,0.25); }
    .plat-windows { background:rgba(0,120,215,0.15); color:#60b4ff; border:1px solid rgba(0,120,215,0.25); }
    .plat-macos   { background:rgba(255,255,255,0.07); color:#c8d0e0; border:1px solid rgba(255,255,255,0.1); }
    .plat-linux   { background:rgba(255,200,50,0.1); color:#ffd740; border:1px solid rgba(255,200,50,0.2); }
    .plat-web     { background:rgba(179,136,255,0.1); color:#b388ff; border:1px solid rgba(179,136,255,0.2); }

    .app-desc {
      font-size: 0.82rem; color: var(--text2);
      line-height: 1.6; margin-bottom: 1rem;
      display: -webkit-box;
      -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    .card-tags {
      display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 1rem;
    }
    .tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.62rem; padding: 2px 7px;
      border-radius: 4px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      color: var(--muted);
    }

    /* ─── Download section ─── */
    .card-footer {
      display: flex; align-items: flex-end;
      justify-content: space-between; gap: 0.6rem;
      margin-top: auto;
    }
    .card-meta {
      display: flex; align-items: center; gap: 0.75rem;
    }
    .meta-item {
      display: flex; align-items: center; gap: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.67rem; color: var(--muted);
    }

    /* ── Split variants panel ── */
    .splits-panel {
      margin-bottom: 0.85rem;
      border: 1px solid var(--border2);
      border-radius: var(--r-sm);
      overflow: hidden;
    }
    .splits-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 7px 11px;
      background: var(--surface2);
      cursor: pointer;
      user-select: none;
      gap: 8px;
    }
    .splits-header:hover { background: var(--surface3); }
    .splits-header-left {
      display: flex; align-items: center; gap: 7px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem; color: var(--text2);
    }
    .splits-icon {
      font-size: 0.72rem;
      background: rgba(179,136,255,0.15);
      border: 1px solid rgba(179,136,255,0.25);
      color: var(--accent2);
      border-radius: 4px;
      padding: 2px 6px;
    }
    .splits-count {
      background: rgba(0,229,255,0.1);
      border: 1px solid rgba(0,229,255,0.2);
      color: var(--accent);
      border-radius: 99px;
      padding: 1px 7px;
      font-size: 0.62rem;
    }
    /* "recommended" badge next to variant label */
    .rec-badge {
      background: rgba(105,255,71,0.12);
      border: 1px solid rgba(105,255,71,0.25);
      color: var(--accent3);
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 0.58rem;
      letter-spacing: 0.04em;
    }
    .splits-chevron {
      font-size: 0.65rem; color: var(--muted);
      transition: transform 0.2s;
    }
    .splits-panel.open .splits-chevron { transform: rotate(180deg); }

    .splits-body {
      display: none;
      flex-direction: column;
      background: rgba(0,0,0,0.18);
    }
    .splits-panel.open .splits-body { display: flex; }

    .split-row {
      display: flex; align-items: center;
      padding: 8px 11px;
      gap: 8px;
      border-top: 1px solid var(--border);
      transition: background 0.13s;
    }
    .split-row:hover { background: rgba(255,255,255,0.03); }
    .split-abi {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      color: var(--text);
      min-width: 90px;
      display: flex; align-items: center; gap: 5px;
    }
    .split-abi-dot {
      width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
    }
    /* ABI colors */
    .abi-arm64   { background: #69ff47; }
    .abi-arm32   { background: #00e5ff; }
    .abi-x86_64  { background: #b388ff; }
    .abi-x86     { background: #ffd740; }
    .abi-universal { background: #ff9cee; }
    .abi-default { background: #52526a; }

    .split-label {
      flex: 1;
      font-size: 0.72rem; color: var(--text2);
    }
    .split-size {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.63rem; color: var(--muted);
      min-width: 36px; text-align: right;
    }
    .split-dl-btn {
      display: flex; align-items: center; gap: 5px;
      background: linear-gradient(135deg, rgba(0,229,255,0.11), rgba(179,136,255,0.07));
      border: 1px solid rgba(0,229,255,0.22);
      color: var(--accent);
      border-radius: 7px;
      padding: 5px 11px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.72rem; font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .split-dl-btn:hover {
      background: linear-gradient(135deg, rgba(0,229,255,0.2), rgba(179,136,255,0.13));
      border-color: var(--accent);
      box-shadow: 0 0 12px rgba(0,229,255,0.15);
    }
    /* Highlight recommended row */
    .split-row.recommended {
      background: rgba(105,255,71,0.04);
    }
    .split-row.recommended .split-abi { color: var(--accent3); }
    .split-row.recommended .split-dl-btn {
      background: linear-gradient(135deg, rgba(105,255,71,0.14), rgba(0,229,255,0.07));
      border-color: rgba(105,255,71,0.3);
      color: var(--accent3);
    }
    .split-row.recommended .split-dl-btn:hover {
      background: linear-gradient(135deg, rgba(105,255,71,0.24), rgba(0,229,255,0.12));
      border-color: var(--accent3);
    }

    /* single download button (no splits) */
    .dl-wrap { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
    .dl-btn {
      display: flex; align-items: center; gap: 6px;
      background: linear-gradient(135deg, rgba(0,229,255,0.14), rgba(179,136,255,0.09));
      border: 1px solid rgba(0,229,255,0.28);
      color: var(--accent);
      border-radius: var(--r-sm);
      padding: 8px 15px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.78rem; font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.17s;
      white-space: nowrap;
    }
    .dl-btn:hover {
      background: linear-gradient(135deg, rgba(0,229,255,0.24), rgba(179,136,255,0.16));
      border-color: var(--accent);
      box-shadow: 0 0 18px rgba(0,229,255,0.18);
      transform: scale(1.02);
    }
    .dl-btn:active { transform: scale(0.97); }
    .dl-btn.tv-dl {
      background: linear-gradient(135deg, rgba(0,229,255,0.18), rgba(105,255,71,0.1));
      border-color: rgba(105,255,71,0.35);
      color: var(--accent3);
      padding: 10px 18px;
      font-size: 0.85rem;
    }
    .dl-size {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.58rem;
      color: var(--muted);
      text-align: right;
    }

    body.tv-mode .app-card { padding: 1.75rem; border-radius: 20px; }
    body.tv-mode .app-name { font-size: 1.15rem; }
    body.tv-mode .app-desc { font-size: 0.9rem; -webkit-line-clamp: 2; }
    body.tv-mode .dl-btn   { padding: 12px 24px; font-size: 0.95rem; border-radius: 12px; }
    body.tv-mode .app-icon { width: 64px; height: 64px; border-radius: 14px; }
    body.tv-mode .app-icon-placeholder { width: 64px; height: 64px; border-radius: 14px; font-size: 28px; }

    /* ─── Empty state ─── */
    .empty-state {
      grid-column: 1/-1;
      display: flex; flex-direction: column; align-items: center;
      padding: 5rem 2rem; text-align: center; gap: 1rem;
    }
    .empty-state .icon { font-size: 3rem; opacity: 0.25; }
    .empty-state p { color: var(--muted); font-size: 0.88rem; }

    /* ─── Footer ─── */
    footer {
      position: relative; z-index: 1;
      border-top: 1px solid var(--border);
      padding: 1.25rem clamp(1.5rem, 5vw, 4rem);
      display: flex; align-items: center; justify-content: space-between;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem; color: var(--muted);
      flex-wrap: wrap; gap: 0.5rem;
    }
    .footer-live { display: flex; align-items: center; gap: 6px; }
    .footer-live .dot {
      width: 6px; height: 6px;
      background: var(--accent3);
      border-radius: 50%;
      animation: pulse-dot 2s infinite;
    }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; }

    @media (max-width: 600px) {
      .app-grid { grid-template-columns: 1fr; }
      #search { width: 150px; }
      #search:focus { width: 180px; }
      .stats-strip { gap: 0.75rem; }
    }
  </style>
</head>
<body>

<div class="bg-fx"></div>

<div id="device-banner">
  <div class="device-info">
    <span class="device-icon" id="d-icon">📱</span>
    <span class="device-label">Detected: <strong id="d-label">Loading…</strong></span>
  </div>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
    <span id="abi-banner-badge">
      <span id="abi-banner-text">Detecting ABI…</span>
    </span>
    <span class="compat-note" id="d-compat">Checking compatibility…</span>
  </div>
</div>

<header>
  <div class="logo">
    <div class="logo-mark">⬡</div>
    App<span>Vault</span>
  </div>
  <div class="header-right">
    <div class="search-wrap">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input type="search" id="search" placeholder="Search apps…" autocomplete="off"/>
    </div>
  </div>
</header>

<section class="hero">
  <div class="hero-eyebrow">
    <span class="live-dot"></span>
    Open Source · Auto-Published via GitHub Actions
  </div>
  <h1>All my apps,<br><span class="grad">one place.</span></h1>
  <p class="hero-sub">Browse, explore, and download every app I've built — filtered for your device automatically.</p>
</section>

<div class="stats-strip" id="stats-strip"></div>
<div class="filter-row" id="filter-row">
  <span class="filter-label">FILTER</span>
  <button class="filter-btn active" data-filter="all">All</button>
</div>
<div class="content-area" id="content-area"></div>

<footer>
  <div class="footer-live"><span class="dot"></span>Auto-updated by GitHub Actions</div>
  <span>© <span id="yr"></span> AppVault</span>
</footer>

<script>
/* ══════════════════ CONFIG ══════════════════ */
const REGISTRY_URL = './apps.json';

/* ══════════════════ ABI DETECTION ══════════════════ */
/*
  ABI key names used in apps.json splits[].abi:
    "arm64-v8a"   → 64-bit ARM (most modern Android)
    "armeabi-v7a" → 32-bit ARM (older Android)
    "x86_64"      → 64-bit x86 (emulators, some Chromebooks)
    "x86"         → 32-bit x86
    "universal"   → fat APK, works everywhere
*/
const ABI_META = {
  'arm64-v8a':   { label:'ARM64',     desc:'64-bit ARM · Modern phones & tablets', dot:'abi-arm64',   short:'arm64' },
  'armeabi-v7a': { label:'ARMv7',     desc:'32-bit ARM · Older/budget devices',    dot:'abi-arm32',   short:'armv7' },
  'x86_64':      { label:'x86_64',    desc:'64-bit x86 · Emulators, Chromebooks',  dot:'abi-x86_64',  short:'x86_64' },
  'x86':         { label:'x86',       desc:'32-bit x86 · Older emulators',         dot:'abi-x86',     short:'x86' },
  'universal':   { label:'Universal', desc:'Works on all architectures',            dot:'abi-universal',short:'all' },
};

/* Attempt to detect device ABI via WebAssembly SIMD + pointer size heuristics.
   This is a best-effort guess — it cannot be 100% accurate from a browser. */
let DEVICE_ABI = null;

async function detectABI() {
  const ua = navigator.userAgent;
  // Rough heuristics from UA string
  if (/x86_64|x86-64|Win64|WOW64|amd64/i.test(ua) && !/Android/i.test(ua)) {
    DEVICE_ABI = 'x86_64'; return;
  }
  if (/Android/i.test(ua)) {
    // Try WASM to check 64-bit support as proxy for arm64
    try {
      const wasm64 = new WebAssembly.Module(new Uint8Array([
        0,97,115,109,1,0,0,0,1,5,1,96,0,1,126,3,2,1,0,7,4,1,0,102,0,10,4,1,2,0,11
      ]));
      DEVICE_ABI = 'arm64-v8a';
    } catch {
      DEVICE_ABI = 'armeabi-v7a';
    }
    return;
  }
  if (/iPhone|iPad/i.test(ua)) { DEVICE_ABI = null; return; }
  DEVICE_ABI = null;
}

/* ══════════════════ DEVICE DETECTION ══════════════════ */
function detectDevice() {
  const ua = navigator.userAgent.toLowerCase();
  const w = window.innerWidth;
  const isTV = /googletv|androidtv|smart-tv|smarttv|hbbtv|netcast|viera|bravia|philips|loewe|samsung.*tv|lg.*tv|tv safari|tvos/.test(ua)
    || (ua.includes('android') && w >= 1280 && !/mobile/.test(ua) && !/tablet/.test(ua))
    || ua.includes('firetv') || ua.includes('fire_tv') || ua.includes('aftb') || ua.includes('aftt');
  const isFireTV = ua.includes('firetv') || ua.includes('fire_tv') || ua.includes('aftb') || ua.includes('aftt');
  const isAndroid = ua.includes('android');
  const isTablet  = isAndroid && !isTV && w >= 768;
  const isPhone   = isAndroid && !isTV && !isTablet;
  const isIOS     = /iphone|ipad/.test(ua);

  if (isTV && isFireTV) return { type:'firetv',  label:'Fire TV',        icon:'📺', compatPlatforms:['android','android-tv'] };
  if (isTV)             return { type:'tv',       label:'Android TV',     icon:'📺', compatPlatforms:['android','android-tv'] };
  if (isTablet)         return { type:'tablet',   label:'Android Tablet', icon:'📱', compatPlatforms:['android'] };
  if (isPhone)          return { type:'android',  label:'Android Phone',  icon:'📱', compatPlatforms:['android'] };
  if (isIOS)            return { type:'ios',       label:'iPhone / iPad',  icon:'🍎', compatPlatforms:[] };
  return                       { type:'desktop',  label:'Desktop',        icon:'💻', compatPlatforms:['windows','macos','linux','web'] };
}

const DEVICE = detectDevice();
document.getElementById('d-icon').textContent  = DEVICE.icon;
document.getElementById('d-label').textContent = DEVICE.label;

const compatNote = {
  tv:      'Showing Android TV compatible apps · Tap Download for sideload guide',
  firetv:  'Showing Fire TV compatible apps · Tap Download for sideload guide',
  android: 'Showing Android apps · APKs download directly',
  tablet:  'Showing Android apps',
  ios:     'No native Android apps — showing all',
  desktop: 'Showing all apps',
}[DEVICE.type] || 'Showing all apps';
document.getElementById('d-compat').textContent = compatNote;
if (DEVICE.type === 'tv' || DEVICE.type === 'firetv') document.body.classList.add('tv-mode');

/* ══════════════════ DATA & STATE ══════════════════ */
let allApps = [];
let activeFilter = 'all';
let searchQuery  = '';

const DEMO_APPS = [
  {
    id:'demo1', name:'DevNotes', version:'1.3.0',
    description:'A fast local markdown notepad for developers.',
    iconBg:'linear-gradient(135deg,#1e3a5f,#0f2040)',
    tags:['productivity','markdown'], platforms:['windows','macos','linux'],
    downloadUrl:'#', downloads:1420, stars:87, updated:'2025-03-08'
  }
];

/* ══════════════════ SPLIT HELPERS ══════════════════ */
/*
  apps.json split variant schema (optional field):
  "splits": [
    { "abi": "arm64-v8a",   "url": "https://…/app-arm64.apk",   "size": "28M" },
    { "abi": "armeabi-v7a", "url": "https://…/app-armv7.apk",   "size": "25M" },
    { "abi": "x86_64",      "url": "https://…/app-x86_64.apk",  "size": "30M" },
    { "abi": "universal",   "url": "https://…/app-universal.apk","size": "55M" }
  ]
  If no splits, falls back to downloadUrl + apkSize as before.
*/

/* ABI preference order — most to least preferred */
const ABI_PREFERENCE = ['arm64-v8a','armeabi-v7a','x86_64','x86','universal'];

function recommendedSplit(splits) {
  if (!splits || !splits.length) return null;
  if (DEVICE_ABI) {
    const exact = splits.find(s => s.abi === DEVICE_ABI);
    if (exact) return exact;
    // Fallback chain for Android
    if (DEVICE_ABI === 'arm64-v8a') {
      const v7 = splits.find(s => s.abi === 'armeabi-v7a');
      if (v7) return v7;
    }
  }
  // If unknown ABI, prefer universal then highest preference
  const uni = splits.find(s => s.abi === 'universal');
  if (uni) return uni;
  for (const abi of ABI_PREFERENCE) {
    const found = splits.find(s => s.abi === abi);
    if (found) return found;
  }
  return splits[0];
}

/* ══════════════════ SCORING ══════════════════ */
function scoreApp(app) {
  let score = 0;
  const platforms = app.platforms || [];
  if (DEVICE.compatPlatforms.length && DEVICE.compatPlatforms.some(p => platforms.includes(p))) score += 50;
  score += Math.min((app.downloads || 0) * 0.1, 20);
  score += Math.min((app.stars || 0) * 0.5, 15);
  if (app.updated) {
    const days = (Date.now() - new Date(app.updated)) / 86400000;
    if (days < 30) score += 10;
    else if (days < 90) score += 5;
  }
  return score;
}

function isDeviceMatch(app) {
  if (!DEVICE.compatPlatforms.length) return true;
  return (app.platforms || []).some(p => DEVICE.compatPlatforms.includes(p));
}

function categorizeApps(apps) {
  const sorted   = [...apps].sort((a,b) => scoreApp(b) - scoreApp(a));
  const matched   = sorted.filter(isDeviceMatch);
  const unmatched = sorted.filter(a => !isDeviceMatch(a));
  const topPicks  = matched.slice(0,3).map(a => ({...a, _topPick:true}));
  const forDevice = matched.map(a => ({...a, _deviceMatch:true}));
  return { topPicks, forDevice, all:sorted, matched, unmatched };
}

/* ══════════════════ RENDER ══════════════════ */
function platBadge(p) {
  const label = { android:'Android','android-tv':'Android TV',windows:'Windows',macos:'macOS',linux:'Linux',web:'Web' };
  return `<span class="plat plat-${p}">${label[p]||p}</span>`;
}

const DL_ICON = `<svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`;

function renderSplitsPanel(app) {
  const splits = app.splits;
  if (!splits || !splits.length) return '';

  const rec  = recommendedSplit(splits);
  const isTV = DEVICE.type === 'tv' || DEVICE.type === 'firetv';

  const rows = splits.map(s => {
    const meta   = ABI_META[s.abi] || { label:s.abi, desc:'', dot:'abi-default', short:s.abi };
    const isRec  = rec && s.abi === rec.abi;
    const recBadge = isRec ? `<span class="rec-badge">✓ REC</span>` : '';
    const url    = s.url || app.downloadUrl || '#';
    const safeUrl= url.replace(/'/g,"\\'");

    let dlBtn;
    if (!url || url === '#') {
      dlBtn = `<span style="font-family:'JetBrains Mono',monospace;font-size:0.62rem;color:var(--muted)">N/A</span>`;
    } else if (isTV) {
      dlBtn = `<a class="split-dl-btn" href="${url}" onclick="tvDownload(event,'${safeUrl}')">${DL_ICON} Get</a>`;
    } else {
      dlBtn = `<a class="split-dl-btn" href="${url}" download target="_blank" rel="noopener">${DL_ICON} Get</a>`;
    }

    return `
      <div class="split-row${isRec?' recommended':''}">
        <div class="split-abi">
          <span class="split-abi-dot ${meta.dot}"></span>
          ${meta.label}
          ${recBadge}
        </div>
        <div class="split-label">${meta.desc}</div>
        <div class="split-size">${s.size||''}</div>
        ${dlBtn}
      </div>`;
  }).join('');

  return `
    <div class="splits-panel" data-splits>
      <div class="splits-header" onclick="toggleSplits(this)">
        <div class="splits-header-left">
          <span class="splits-icon">APK</span>
          Download variants
          <span class="splits-count">${splits.length}</span>
        </div>
        <span class="splits-chevron">▼</span>
      </div>
      <div class="splits-body">${rows}</div>
    </div>`;
}

function renderDownloadArea(app) {
  const isTV = DEVICE.type === 'tv' || DEVICE.type === 'firetv';

  // If app has splits, show the collapsible splits panel
  if (app.splits && app.splits.length) {
    const rec = recommendedSplit(app.splits);
    if (rec) {
      const url = rec.url || app.downloadUrl || '#';
      const safeUrl = url.replace(/'/g,"\\'");
      const meta = ABI_META[rec.abi] || { label:rec.abi };
      let quickBtn;
      if (!url || url === '#') {
        quickBtn = '';
      } else if (isTV) {
        quickBtn = `<a class="dl-btn tv-dl" href="${url}" onclick="tvDownload(event,'${safeUrl}')">${DL_ICON} ${meta.label} APK</a>`;
      } else {
        quickBtn = `<a class="dl-btn" href="${url}" download target="_blank" rel="noopener">${DL_ICON} ${meta.label} APK</a>`;
      }
      const sizeHtml = rec.size ? `<span class="dl-size">${rec.size}</span>` : '';
      return { splitsHtml: renderSplitsPanel(app), footerDl: `<div class="dl-wrap">${quickBtn}${sizeHtml}</div>` };
    }
  }

  // Fallback — single download
  const url = app.downloadUrl;
  if (!url || url === '#') {
    return { splitsHtml:'', footerDl:`<span style="font-family:'JetBrains Mono',monospace;font-size:0.65rem;color:var(--muted);padding:7px 10px">No download</span>` };
  }
  const safeUrl = url.replace(/'/g,"\\'");
  let dlBtn;
  if (isTV) {
    dlBtn = `<a class="dl-btn tv-dl" href="${url}" onclick="tvDownload(event,'${safeUrl}')">${DL_ICON} Download APK</a>`;
  } else {
    dlBtn = `<a class="dl-btn" href="${url}" download target="_blank" rel="noopener">${DL_ICON} Download</a>`;
  }
  const sizeHtml = app.apkSize ? `<span class="dl-size">${app.apkSize}</span>` : '';
  return { splitsHtml:'', footerDl:`<div class="dl-wrap">${dlBtn}${sizeHtml}</div>` };
}

function renderCard(app, delay=0) {
  const plats = (app.platforms||[]).map(platBadge).join('');
  const tags  = (app.tags||[]).slice(0,5).map(t=>`<span class="tag">${t}</span>`).join('');

  const dlsHtml = app.downloads ? `<span class="meta-item"><svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>${app.downloads.toLocaleString()}</span>` : '';
  const updHtml = app.updated  ? `<span class="meta-item"><svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>${app.updated}</span>` : '';

  const iconEl = app.iconUrl
    ? `<img class="app-icon" src="${app.iconUrl}" alt="${app.name}" onerror="this.outerHTML='<div class=\\'app-icon-placeholder\\' style=\\'background:${app.iconBg||'var(--surface2)'}\\'>📦</div>'">`
    : `<div class="app-icon-placeholder" style="background:${app.iconBg||'var(--surface2)'}">📦</div>`;

  const { splitsHtml, footerDl } = renderDownloadArea(app);

  const cardClass = ['app-card', app._topPick?'top-pick':'', app._deviceMatch?'device-match':''].filter(Boolean).join(' ');

  return `
    <div class="${cardClass}" style="animation-delay:${delay}ms">
      <div class="card-top">
        ${iconEl}
        <div class="app-meta">
          <div class="app-name">${app.name}</div>
          <div class="app-version">v${app.version||'1.0'}</div>
          <div class="platform-pills">${plats}</div>
        </div>
      </div>
      <p class="app-desc">${app.description||''}</p>
      ${tags ? `<div class="card-tags">${tags}</div>` : ''}
      ${splitsHtml}
      <div class="card-footer">
        <div class="card-meta">${dlsHtml}${updHtml}</div>
        ${footerDl}
      </div>
    </div>`;
}

function renderSection(title, icon, iconBg, apps, id, gridClass='') {
  if (!apps.length) return '';
  const cards = apps.map((a,i) => renderCard(a, i*50)).join('');
  return `
    <div id="section-${id}">
      <div class="section-heading">
        <div class="section-heading-icon" style="background:${iconBg}">${icon}</div>
        <h2>${title}</h2>
        <span class="badge">${apps.length} app${apps.length!==1?'s':''}</span>
      </div>
      <div class="app-grid ${gridClass}">${cards}</div>
    </div>`;
}

function renderAll(apps) {
  const area = document.getElementById('content-area');
  if (!apps.length) {
    area.innerHTML = `<div class="app-grid"><div class="empty-state"><div class="icon">🔭</div><p>No apps match your search.</p></div></div>`;
    return;
  }
  const cats = categorizeApps(apps);
  const q    = searchQuery.trim();

  if (q || activeFilter !== 'all') {
    const filtered = applySearchFilter(apps);
    area.innerHTML = renderSection('Results','🔍','rgba(0,229,255,0.15)', filtered.map(a=>({...a,_deviceMatch:isDeviceMatch(a)})),'filtered');
    return;
  }

  const parts = [];
  if (cats.topPicks.length && DEVICE.compatPlatforms.length) {
    parts.push(renderSection(`Top Picks for ${DEVICE.label}`,'★','rgba(255,215,64,0.15)',cats.topPicks,'top','featured'));
  }
  if (cats.forDevice.length && DEVICE.compatPlatforms.length) {
    const rest = cats.forDevice.filter(a => !cats.topPicks.find(t=>t.id===a.id));
    if (rest.length) parts.push(renderSection(`More for ${DEVICE.label}`,DEVICE.icon,'rgba(105,255,71,0.12)',rest,'device'));
  }
  if (cats.unmatched.length) parts.push(renderSection('Other Apps','📦','rgba(179,136,255,0.12)',cats.unmatched,'other'));
  if (!parts.length || !DEVICE.compatPlatforms.length) {
    parts.length = 0;
    parts.push(renderSection('All Apps','⬡','rgba(0,229,255,0.1)',cats.all,'all'));
  }
  area.innerHTML = parts.join('');
}

function applySearchFilter(apps) {
  let result = apps;
  const q = searchQuery.toLowerCase().trim();
  if (activeFilter !== 'all') result = result.filter(a=>(a.tags||[]).includes(activeFilter));
  if (q) result = result.filter(a =>
    a.name.toLowerCase().includes(q) ||
    (a.description||'').toLowerCase().includes(q) ||
    (a.tags||[]).some(t=>t.includes(q))
  );
  return result;
}

function refreshView() { renderAll(allApps); }

/* ══════════════════ STATS ══════════════════ */
function renderStats(apps) {
  const totalDls = apps.reduce((s,a)=>(s+(a.downloads||0)),0);
  const hasSplits = apps.some(a => a.splits && a.splits.length);
  const strip = document.getElementById('stats-strip');
  strip.innerHTML = `
    <div class="stat-pill"><span class="n">${apps.length}</span><span class="l">apps</span></div>
    <div class="stat-pill"><span class="n">${totalDls.toLocaleString()}</span><span class="l">total downloads</span></div>
    <div class="stat-pill"><span class="n">${DEVICE.icon}</span><span class="l">${DEVICE.label}</span></div>
    ${hasSplits?`<div class="stat-pill"><span class="n">⚙</span><span class="l">split APKs</span></div>`:''}`;
}

/* ══════════════════ FILTERS ══════════════════ */
function buildFilters(apps) {
  const allTags = new Set(apps.flatMap(a=>a.tags||[]));
  const bar = document.getElementById('filter-row');
  [...bar.querySelectorAll('[data-filter]:not([data-filter="all"])')].forEach(b=>b.remove());
  allTags.forEach(tag => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.dataset.filter = tag;
    btn.textContent = tag;
    bar.appendChild(btn);
  });
}

document.getElementById('filter-row').addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  activeFilter = btn.dataset.filter;
  refreshView();
});
document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value;
  refreshView();
});

/* ══════════════════ TOGGLE SPLITS PANEL ══════════════════ */
function toggleSplits(headerEl) {
  const panel = headerEl.closest('[data-splits]');
  panel.classList.toggle('open');
}

/* ══════════════════ TV DOWNLOAD ══════════════════ */
function tvDownload(e, url) {
  e.preventDefault();
  window.location.href = url;
}

/* ══════════════════ LOAD ══════════════════ */
document.getElementById('yr').textContent = new Date().getFullYear();

async function loadApps() {
  // Detect ABI in parallel
  await detectABI();

  // Show ABI badge
  if (DEVICE_ABI) {
    const meta = ABI_META[DEVICE_ABI];
    const badge = document.getElementById('abi-banner-badge');
    const text  = document.getElementById('abi-banner-text');
    if (meta) {
      text.textContent = `CPU: ${meta.label} — recommended splits highlighted`;
      badge.classList.add('show');
    }
  }

  try {
    const res = await fetch(REGISTRY_URL, { cache:'no-cache' });
    if (!res.ok) throw new Error('not found');
    allApps = await res.json();
  } catch {
    allApps = DEMO_APPS;
  }
  buildFilters(allApps);
  renderStats(allApps);
  renderAll(allApps);
}

loadApps();
</script>
</body>
</html>
